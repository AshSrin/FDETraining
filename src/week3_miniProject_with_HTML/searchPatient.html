<html>
    <head>
        <title>Search Patient</title>
        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: Arial, sans-serif;
                background: linear-gradient(135deg, #eef6ff 0%, #f8fbff 100%);
                padding: 24px;
                color: #1f2937;
            }

            .page-container {
                width: 100%;
                max-width: 900px;
                margin: 0 auto;
                background: #ffffff;
                border-radius: 18px;
                box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
                border: 1px solid #e5edf8;
                padding: 32px 28px;
            }

            .page-header {
                margin-bottom: 24px;
                text-align: center;
            }

            .page-header h1 {
                margin: 0;
                font-size: 2rem;
                color: #1d3557;
            }

            .form-card {
                display: flex;
                flex-direction: column;
                gap: 18px;
            }

            .field-row {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            label {
                font-weight: 700;
                color: #2d3748;
            }

            input[type="text"], select {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #cbd5e1;
                border-radius: 10px;
                font-size: 1rem;
                background: #f8fafc;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input[type="text"]:focus, select:focus {
                outline: none;
                border-color: #3b82f6;
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
                background: #ffffff;
            }

            button {
                margin-top: 8px;
                padding: 12px 16px;
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg, #2563eb, #1d4ed8);
                color: white;
                font-size: 1rem;
                font-weight: 700;
                cursor: pointer;
                transition: transform 0.15s ease, box-shadow 0.15s ease;
                box-shadow: 0 8px 18px rgba(37, 99, 235, 0.2);
            }

            button:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 20px rgba(37, 99, 235, 0.25);
            }

            button:active {
                transform: translateY(0);
            }

            .results-box {
                margin-top: 24px;
                background: #ffffff;
                border-radius: 16px;
                border: 1px solid #e5edf8;
                box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
                padding: 20px;
                overflow-x: auto;
            }

            .results-box h2 {
                margin: 0 0 16px;
                color: #1d3557;
                font-size: 1.3rem;
            }

            table {
                width: 100%;
                min-width: 700px;
                border-collapse: collapse;
                font-size: 0.95rem;
            }

            th, td {
                border-bottom: 1px solid #e5e7eb;
                padding: 10px 8px;
                text-align: left;
            }

            th {
                background: #f8fafc;
                color: #374151;
            }
        </style>
    </head>
    <body>
        <div class="page-container">
            <div class="page-header">
                <h1>Search Patient</h1>
            </div>

            <form class="form-card">
                <div class="field-row">
                    <label for="patientNumber">Patient Number:</label>
                    <input type="text" id="patientNumber" name="patientNumber" placeholder="Enter patient number">
                </div>

                <div class="field-row">
                    <label for="riskLevel">Risk Level:</label>
                    <select id="riskLevel" name="riskLevel">
                        <option value="">Select Risk Level</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="field-row">
                    <label for="riskScore">Risk Score:</label>
                    <input type="text" id="riskScore" name="riskScore" placeholder="Enter risk score">
                </div>

                <button type="submit">Search</button>
            </form>

            <div class="results-box">
                <h2>Search Results</h2>
                <div class="results-scroll">
                    <table id="resultsTable">
                        <thead>
                            <tr>
                                <th>Encounter ID</th>
                                <th>Patient Number</th>
                                <th>Risk Level</th>
                                <th>Risk Score</th>
                                <th>Age</th>
                            </tr>
                        </thead>
                        <tbody id="resultsTableBody">
                            <tr>
                                <td colspan="5">No results yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script>
            const resultsBody = document.getElementById('resultsTableBody');

            function showTableMessage(message) {
                resultsBody.innerHTML = `
                    <tr>
                        <td colspan="5">${message}</td>
                    </tr>
                `;
            }

            async function searchPatient() {
                const patientNumber = document.getElementById('patientNumber').value.trim();
                const riskLevel = document.getElementById('riskLevel').value;
                const riskScore = document.getElementById('riskScore').value.trim();

                const filledCriteria = [
                    patientNumber !== "",
                    riskLevel !== "",
                    riskScore !== ""
                ].filter(Boolean).length;

                if (filledCriteria === 0) {
                    showTableMessage('At least one search criteria must be entered.');
                    return;
                }

                if (filledCriteria > 1) {
                    showTableMessage('Only one search criteria can be entered at a time.');
                    return;
                }

                let apiUrl = '';

                if (patientNumber) {
                    if (!/^\d+$/.test(patientNumber)) {
                        showTableMessage('The search criteria entered is invalid.');
                        return;
                    }
                    apiUrl = `http://localhost:8001/encounters?patient_nbr=${encodeURIComponent(patientNumber)}&limit=50`;
                }
                
                
                else if (riskLevel) {
                    const validRiskLevels = ['low', 'medium', 'high'];
                    if (!validRiskLevels.includes(riskLevel.toLowerCase())) {
                        showTableMessage('The search criteria entered is invalid.');
                        return;
                    }
                    apiUrl = `http://localhost:8001/encounters?risk_level=${encodeURIComponent(riskLevel.toUpperCase())}&limit=50`;
                } else if (riskScore) {
                    if (!/^\d+$/.test(riskScore)) {
                        showTableMessage('The search criteria entered is invalid.');
                        return;
                    }
                    apiUrl = `http://localhost:8001/encounters?risk_score=${encodeURIComponent(riskScore)}&limit=50`;
                }

                try {
                    const response = await fetch(apiUrl);

                    if (!response.ok) {
                        showTableMessage('No results were found for the entered search criteria.');
                        return;
                    }

                    const data = await response.json();
                    const items = Array.isArray(data) ? data : (data && typeof data === 'object' ? [data] : []);

                    if (!items.length) {
                        showTableMessage('No results were found.');
                        return;
                    }
                    // if risklevel is LOW, the search shouldn't display encounter id as a link
                    resultsBody.innerHTML = items.map(item => `
                        <tr>
                            
                            <td>${item.risk_level === 'LOW' ? item.encounter_id ?? '' : `<a href="updatePatientDetails.html?encounter_id=${encodeURIComponent(item.encounter_id ?? '')}&patient_nbr=${encodeURIComponent(item.patient_nbr ?? '')}">${item.encounter_id ?? ''}</a>`}</td>
                            <td>${item.patient_nbr ?? ''}</td>
                            <td>${item.risk_level ?? ''}</td>
                            <td>${item.risk_score ?? ''}</td>
                            <td>${item.age ?? ''}</td>
                        </tr>
                    `).join('');
                    

                } catch (error) {
                    console.error('Search error:', error);
                    showTableMessage('An error occurred while fetching the results.');
                }
            }

            document.querySelector('button[type="submit"]').addEventListener('click', function (event) {
                event.preventDefault();
                searchPatient();
            });

          
            
        </script>
    </body>
</html>
